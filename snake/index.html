<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Snake</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            color: #4CAF50;
            margin-top: 0;
            text-shadow: 0 0 10px #4CAF50;
            font-size: 2.5em;
        }
        
        .game-info {
            display: flex;
            justify-content: space-between;
            width: 500px;
            margin: 10px auto;
            color: white;
            font-size: 1.2em;
        }
        
        #game-board {
            border: 2px solid #4CAF50;
            background-color: #111;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
        }
        
        .controls {
            margin-top: 20px;
            color: white;
        }
        
        .controls p {
            margin: 5px 0;
        }
        
        .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 5px;
            margin: 0 5px;
        }
        
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            display: none;
            z-index: 10;
            border: 2px solid #f44336;
        }
        
        .game-over h2 {
            color: #f44336;
            margin-top: 0;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1.1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #45a049;
            transform: scale(1.05);
        }
        
        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            z-index: 10;
            border: 2px solid #4CAF50;
        }
        
        .start-screen h2 {
            color: #4CAF50;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="start-screen" id="start-screen">
        <h2>Game Snake</h2>
        <p>Điều khiển con rắn để ăn thức ăn và phát triển!</p>
        <button id="start-button">Bắt đầu chơi</button>
    </div>
    
    <div class="game-over" id="game-over">
        <h2>Game Over!</h2>
        <p>Điểm số: <span id="final-score">0</span></p>
        <button id="restart-button">Chơi lại</button>
    </div>
    
    <div class="game-container">
        <h1>🐍 Game Snake</h1>
        <div class="game-info">
            <div>Điểm số: <span id="score">0</span></div>
            <div>Độ dài: <span id="length">3</span></div>
        </div>
        <canvas id="game-board" width="500" height="500"></canvas>
        <div class="controls">
            <p>Điều khiển: <span class="key">↑</span> <span class="key">←</span> <span class="key">↓</span> <span class="key">→</span></p>
            <p>Hoặc dùng: <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span></p>
        </div>
    </div>

    <script>
        // Game elements
        const canvas = document.getElementById('game-board');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const lengthDisplay = document.getElementById('length');
        const finalScoreDisplay = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over');
        const startScreen = document.getElementById('start-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        
        // Game settings
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        // Game state
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let gameRunning = false;
        let gameSpeed = 120;
        
        // Initialize game
        function initGame() {
            // Reset snake
            snake = [
                {x: 10, y: 10},
                {x: 9, y: 10},
                {x: 8, y: 10}
            ];
            
            // Reset direction
            dx = 1;
            dy = 0;
            
            // Reset score
            score = 0;
            scoreDisplay.textContent = score;
            lengthDisplay.textContent = snake.length;
            
            // Generate first food
            generateFood();
            
            // Hide game over screen
            gameOverScreen.style.display = 'none';
        }
        
        // Generate food at random position
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            
            // Make sure food doesn't appear on snake
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    break;
                }
            }
        }
        
        // Draw game elements
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = '#222';
            for (let i = 0; i < tileCount; i++) {
                for (let j = 0; j < tileCount; j++) {
                    ctx.strokeRect(i * gridSize, j * gridSize, gridSize, gridSize);
                }
            }
            
            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Snake head
                    ctx.fillStyle = '#4CAF50';
                } else {
                    // Snake body
                    ctx.fillStyle = '#8BC34A';
                }
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                
                // Add border to segments
                ctx.strokeStyle = '#1B5E20';
                ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
            });
            
            // Draw food
            ctx.fillStyle = '#f44336';
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize/2,
                food.y * gridSize + gridSize/2,
                gridSize/2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }
        
        // Move snake
        function move() {
            // Calculate new head position
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            
            // Check collision with walls
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // Check collision with self
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    gameOver();
                    return;
                }
            }
            
            // Add new head
            snake.unshift(head);
            
            // Check if food is eaten
            if (head.x === food.x && head.y === food.y) {
                // Increase score
                score += 10;
                scoreDisplay.textContent = score;
                lengthDisplay.textContent = snake.length;
                
                // Generate new food
                generateFood();
                
                // Increase speed slightly
                if (gameSpeed > 50) {
                    gameSpeed -= 2;
                }
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
        }
        
        // Game loop
        function gameLoop() {
            if (gameRunning) {
                move();
                draw();
                setTimeout(gameLoop, gameSpeed);
            }
        }
        
        // Handle keyboard input
        function handleKeydown(e) {
            // Prevent arrow keys from scrolling the page
            if ([37, 38, 39, 40, 65, 87, 68, 83].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            // Left arrow or A
            if ((e.keyCode === 37 || e.keyCode === 65) && dx === 0) {
                dx = -1;
                dy = 0;
            }
            // Up arrow or W
            else if ((e.keyCode === 38 || e.keyCode === 87) && dy === 0) {
                dx = 0;
                dy = -1;
            }
            // Right arrow or D
            else if ((e.keyCode === 39 || e.keyCode === 68) && dx === 0) {
                dx = 1;
                dy = 0;
            }
            // Down arrow or S
            else if ((e.keyCode === 40 || e.keyCode === 83) && dy === 0) {
                dx = 0;
                dy = 1;
            }
        }
        
        // Game over function
        function gameOver() {
            gameRunning = false;
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'block';
        }
        
        // Start game
        function startGame() {
            initGame();
            gameRunning = true;
            startScreen.style.display = 'none';
            gameLoop();
        }
        
        // Event listeners
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);
        document.addEventListener('keydown', handleKeydown);
        
        // Initial draw
        draw();
    </script>
</body>
</html>
